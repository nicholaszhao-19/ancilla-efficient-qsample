name: Validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "./qsample-validation[test]" -c qsample-validation/requirements-repro.txt
      - run: python -W error -m pytest
        working-directory: qsample-validation
      - run: python -m ruff check .
        working-directory: qsample-validation
